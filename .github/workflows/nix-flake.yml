name: Nix Flake Update

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag to update flake for'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to update flake for'
        type: string
        required: true

jobs:
  update-flake:
    name: Update Nix Flake
    runs-on: ubuntu-latest

    steps:
      - name: Clone nix repository
        uses: actions/checkout@v7
        with:
          repository: fagramdesktop/nix
          token: ${{ secrets.PAT }}
          path: nix

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Prefetch source and compute hash
        id: prefetch
        run: |
          OWNER="fagramdesktop"
          REPO="fadesktop"
          TAG="${{ inputs.release_tag }}"

          REV=$(curl -sf "https://api.github.com/repos/${OWNER}/${REPO}/git/ref/tags/${TAG}" \
            | jq -r '.object.sha')

          if [ "$REV" = "null" ] || [ -z "$REV" ]; then
            echo "::error::Could not resolve tag ${TAG} to a commit"
            exit 1
          fi
          echo "Resolved tag ${TAG} to commit ${REV}"

          PREFETCH_JSON=$(nix shell nixpkgs#nix-prefetch-git -c nix-prefetch-git \
            --url "https://github.com/${OWNER}/${REPO}" \
            --rev "$REV" \
            --fetch-submodules \
            --quiet)

          HASH=$(echo "$PREFETCH_JSON" | jq -r '.hash')
          echo "Source Hash: $HASH"
          echo "Source Rev: $REV"

          echo "rev=$REV" >> $GITHUB_OUTPUT
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Update pkgs/unwrapped.nix
        run: |
          VERSION="${{ inputs.release_tag }}"
          REV="${{ steps.prefetch.outputs.rev }}"
          HASH="${{ steps.prefetch.outputs.hash }}"

          cd nix

          sed -i "s|version = \".*\";|version = \"${VERSION}\";|" pkgs/unwrapped.nix
          sed -i "s|rev = \".*\";|rev = \"${REV}\";|" pkgs/unwrapped.nix
          sed -i "s|hash = \".*\";|hash = \"${HASH}\";|" pkgs/unwrapped.nix

          echo "Updated pkgs/unwrapped.nix:"
          cat pkgs/unwrapped.nix

      - name: Commit and push changes
        run: |
          cd nix
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pkgs/unwrapped.nix
          git commit -m "nix: update fagram-desktop to ${{ inputs.release_tag }}"
          git push
